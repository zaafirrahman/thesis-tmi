# Menyajikan folder web/ lewat GitHub Pages (situs statis, tanpa langkah build).
# Jalan otomatis tiap ada perubahan di web/ pada branch main (termasuk saat PR pembaruan data di-merge).
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek berkas situs
        run: |
          python3 - <<'PY'
          import json, os
          for f in ('thesis-data.json', 'abstracts.json'):
              assert os.path.exists('web/data/' + f), (
                  'web/data/' + f + ' tidak ada di repo. Penyebab umum: .gitignore mengabaikan "data/" '
                  '(harus "/data/"). Perbaiki lalu: git add web/data')
          d = json.load(open('web/data/thesis-data.json', encoding='utf-8'))
          a = json.load(open('web/data/abstracts.json', encoding='utf-8'))
          assert len(d['theses']) > 0, 'thesis-data.json kosong'
          for f in ('index.html', 'sw.js', 'manifest.json', 'js/app.js', 'css/style.css'):
              assert os.path.exists('web/' + f), 'hilang: ' + f
          print(f"OK: {len(d['theses'])} tesis, {len(a)} abstrak")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
