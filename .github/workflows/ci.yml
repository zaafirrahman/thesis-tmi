# Menjalankan tes pada tiap push/PR buatan manusia.
# Catatan: PR yang dibuat otomatis oleh update-data.yml memakai GITHUB_TOKEN sehingga tidak memicu workflow ini;
# tes untuk jalur itu sudah dijalankan di dalam update-data.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Sintaks JavaScript
        run: node -e "new Function(require('fs').readFileSync('web/js/app.js','utf8')); console.log('app.js OK')"
