# Dosen di luar daftar resmi KK (config/kk.yaml).
#
# anggota_lain : dosen yang KK-nya TIDAK eksplisit di web TMI (riwayat bimbingan / kesimpulan).
#   yakin  : 0-1. Menurunkan bobot sinyal dosen. 1.0 = setara dosen resmi.
#            Aturan awal: prioritas A (>=10 tesis) = 1.0, B (3-9) = 0.6, C (1-2) = 0.35.
#            Bila KK dosen BEDA dari hasil kata kunci+judul tesisnya, bobotnya turun lagi
#            (CONFLICT_FACTOR di classify_thesis.py) dan tesis ditandai perlu_review.
#   pola   : regex pada nama yang sudah dinormalisasi (huruf kecil, tanpa gelar); mencakup
#            semua ejaan di digilib.
# tanpa_kk     : dosen yang memang tidak punya KK TMI (SBM, fakultas lain, dosen luar, atau tidak
#            bisa dipastikan). Tesisnya diklasifikasi dari kata kunci+judul saja, dan tidak
#            muncul lagi di laporan "belum ter-map".

